    heading: Eligibility for Courier-Funded Re-Dispatch
    page: 1
    body:
      - >-
        RaftarXpress funds 100% of re-dispatch freight charges when a delivery
        error is proven to be caused by internal route misdirection, damaged
        transit, or courier barcode mis-scan.

  - ref: "2"
    source_id: DOC-011-S2
    heading: Merchant Replacement Fulfillment
    page: 1
    body:
      - >-
        For e-commerce merchant accounts, replacement shipments are assigned
        express priority lane tags and dispatched within twenty-four (24) hours of
        claim authorization.

  - ref: "3"
    source_id: DOC-011-S3
    heading: Reverse Pickup Coordination
    page: 2
    body:
      - >-
        Replacement delivery and defective item pickup must occur simultaneously
        where reverse logistics services are active, reducing customer wait times.
