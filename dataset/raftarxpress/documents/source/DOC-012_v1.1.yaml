    page: 1
    body:
      - >-
        Shippers may cancel booking requests without penalty at any time prior to
        rider dispatch from the local operations hub.

  - ref: "2"
    source_id: DOC-012-S2
    heading: In-Transit Interception Restrictions
    page: 1
    body:
      - >-
        Shipments already sorted into linehaul inter-city transit cannot be
        immediately cancelled; an interception request may be logged to trigger
        Return to Origin upon arrival at the destination hub.

  - ref: "3"
    source_id: DOC-012-S3
    heading: Cancellation Surcharges
    page: 2
    body:
      - >-
        A nominal attempted pickup charge of PKR 150 applies if the rider arrives
        at the merchant warehouse and pickup is declined without prior portal
        cancellation.
