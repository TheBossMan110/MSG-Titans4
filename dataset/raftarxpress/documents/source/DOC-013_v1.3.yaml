    heading: Volumetric and Dead Weight Calculation
    page: 1
    body:
      - >-
        Freight charges are billed based on the higher of dead weight or
        volumetric weight calculated using the standard formula: (Length x Width x
        Height in cm) / 5000.

  - ref: "2"
    source_id: DOC-013-S2
    heading: Fuel Surcharge and Tax Invoicing
    page: 1
    body:
      - >-
        All corporate invoices include the prevailing monthly variable fuel
        surcharge and applicable provincial sales tax (PST/GST) in full compliance
        with FBR regulations.

  - ref: "3"
    source_id: DOC-013-S3
    heading: Billing Dispute Resolution Period
    page: 2
    body:
      - >-
        Clients must register invoice weight or tariff disputes within fifteen
        (15) days of monthly invoice generation. Uncontested invoices become final
        and payable upon expiration.
