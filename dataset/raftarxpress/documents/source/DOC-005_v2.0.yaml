sections:
  - ref: "1"
    source_id: DOC-005-S1
    heading: Maximum Cash Collection Threshold
    page: 1
    body:
      - >-
        The maximum permissible Cash-on-Delivery (COD) collection per individual
        parcel consignment is PKR 100,000. Consignments exceeding this value must
        be prepaid via digital banking or company escrow.

  - ref: "2"
    source_id: DOC-005-S2
    heading: Merchant Remittance Schedule
    page: 1
    body:
      - >-
        Collected COD funds are disbursed to verified merchant bank accounts on a
        weekly cycle every Wednesday, provided the accumulated merchant balance
        exceeds PKR 5,000.

  - ref: "3"
    source_id: DOC-005-S3
    heading: Discrepancy Reporting & Reconciliation
    page: 2
    body:
      - >-
        Any mismatch between physical cash collected by the rider and the booking
        invoice amount must be flagged in SupportNova within twenty-four (24)
        hours of hub reconciliation.

  - ref: "4"
    source_id: DOC-005-S4
    heading: Rider Cash Safety & Deposit
    page: 2
    body:
      - >-
        Couriers must deposit all accumulated daily COD collections at the
        designated hub cash vault by 19:00 PST daily. Carrying overnight company
        cash is grounds for immediate termination.
