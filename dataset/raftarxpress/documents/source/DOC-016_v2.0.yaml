    page: 1
    body:
      - >-
        Complaints unacknowledged after two (2) hours or unresolved after
        twenty-four (24) hours automatically escalate from frontline support to
        the Department Lead.

  - ref: "2"
    source_id: DOC-016-S2
    heading: Tier-3 Executive Intervention (DEPT-09)
    page: 1
    body:
      - >-
        Grievances involving VIP account SLA breaches, legal notices, regulatory
        inquiries, or damages exceeding PKR 100,000 are routed directly to
        Management Escalations (DEPT-09).

  - ref: "3"
    source_id: DOC-016-S3
    heading: Executive Response SLAs
    page: 2
    body:
      - >-
        Management Escalations must formulate a verified remediation plan and
        contact the customer within one (1) business hour of escalation.
