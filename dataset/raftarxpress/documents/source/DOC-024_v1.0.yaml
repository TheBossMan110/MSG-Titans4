    heading: Customs Impoundment and Hold Procedure
    page: 1
    body:
      - >-
        If a shipment is held at customs check-posts, Compliance & Legal (DEPT-07)
        must obtain clearance documents from the shipper within 48 hours to avoid
        regulatory confiscation.

