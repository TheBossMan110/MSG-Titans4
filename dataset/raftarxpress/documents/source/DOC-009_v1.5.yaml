  - ref: "1"
    source_id: DOC-009-S1
    heading: Customer Right to Grievance Redressal
    page: 1
    body:
      - >-
        Every customer, merchant, and corporate client has the right to log formal
        complaints regarding service lapses, rider misconduct, delivery delays,
        and tariff disputes via the SupportNova platform.

  - ref: "2"
    source_id: DOC-009-S2
    heading: Ticket Categorization and Acknowledgement
    page: 1
    body:
      - >-
        All incoming tickets must be categorized under approved taxonomy codes and
        acknowledged via automated SMS and email within one (1) business hour of
        submission.

  - ref: "3"
    source_id: DOC-009-S3
    heading: Single-Point-of-Contact Ownership
    page: 2
    body:
      - >-
        Once assigned, the designated support agent retains ownership of the
        complaint until full resolution, ensuring seamless cross-department
        coordination without customer bounce.

  - ref: "4"
    source_id: DOC-009-S4
    heading: Zero Cash Settlement Protocol
    page: 2
    body:
      - >-
        Zero cash settlements are permitted at agent level. All financial
        compensations and fee adjustments must be formally routed through Billing
        & Accounts (DEPT-02) and credited via IBFT only.
