  - ref: "1"
    source_id: DOC-004-S1
    heading: Delivery Attempt Limitations
    page: 1
    body:
      - >-
        Under the legacy protocol, couriers were required to make exactly two (2)
        delivery attempts before marking consignments for immediate Return to
        Origin (RTO). No holding period was observed at regional hubs.

  - ref: "2"
    source_id: DOC-004-S2
    heading: Re-attempt Surcharge
    page: 1
    body:
      - >-
        A flat re-attempt surcharge of PKR 100 was automatically billed to the
        shipper for every second delivery attempt requested by the consignee.

  - ref: "3"
    source_id: DOC-004-S3
    heading: Proof of Delivery Collection
    page: 2
    body:
      - >-
        Physical paper run-sheets with manual recipient signatures served as the
        sole proof of delivery, with no digital OTP or geo-tagging requirement.
