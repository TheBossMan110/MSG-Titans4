    page: 1
    body:
      - >-
        Recipient names, phone numbers, and delivery addresses are encrypted at
        rest and in transit, accessible only to assigned couriers via masked
        application interfaces.

  - ref: "2"
    source_id: DOC-015-S2
    heading: Prohibition on Data Monetization
    page: 1
    body:
      - >-
        RaftarXpress Logistics never sells, leases, or shares customer transaction
        records or recipient contact details with third-party marketing brokers.

  - ref: "3"
    source_id: DOC-015-S3
    heading: Data Retention and Deletion
    page: 2
    body:
      - >-
        Delivery manifests and tracking logs are archived for twenty-four (24)
        months for audit and taxation purposes, after which PII records are
        securely purged.
