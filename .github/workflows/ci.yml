name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  # ── fast lane: lint, secrets, migrations and the full suite on SQLite ──
  checks:
    runs-on: ubuntu-latest
    # The backend lives in backend/ since the project split into
    # backend / frontend / dataset. Workflows must stay at the
    # repository root, so every step runs one level down instead.
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Secret scan
        run: |
          detect-secrets scan --exclude-files '\.venv/|node_modules/|\.git/' > .secrets.report
          python - <<'PY'
          import json, sys
          data = json.load(open(".secrets.report"))
          found = data.get("results", {})
          if found:
              print("Potential secrets detected in:", *found, sep="\n  ")
              sys.exit(1)
          print("No secrets detected.")
          PY

      - name: Render the sample corpus
        run: python scripts/make_sample_documents.py

      - name: Migrations apply and reverse cleanly
        env:
          DATABASE_URL: sqlite:///./var/ci.db
          JWT_SECRET: ci-secret
        run: |
          mkdir -p var
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head

      - name: Tests (SQLite)
        env:
          JWT_SECRET: ci-secret
        run: pytest -q --cov=src --cov=knowledge_base --cov=document_processing --cov-report=term-missing

  # ── production-dialect lane ──
  #
  # The SQLite suite is fast but it is NOT the deployment target. Two real bugs
  # (CAST(boolean AS FLOAT), and pgvector's comparator being hidden by our
  # TypeDecorator) passed every SQLite test and failed on Supabase. This job
  # runs the same suite against PostgreSQL with pgvector so that gap cannot
  # reopen silently.
  postgres:
    runs-on: ubuntu-latest
    # The backend lives in backend/ since the project split into
    # backend / frontend / dataset. Workflows must stay at the
    # repository root, so every step runs one level down instead.
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: supportnova
          POSTGRES_PASSWORD: supportnova
          POSTGRES_DB: supportnova_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://supportnova:supportnova@localhost:5432/supportnova_test
      JWT_SECRET: ci-secret
      EMBEDDING_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Render the sample corpus
        run: python scripts/make_sample_documents.py

      - name: Migrations on PostgreSQL
        run: |
          mkdir -p var
          python -m alembic upgrade head
          python -m alembic downgrade base
          python -m alembic upgrade head

      - name: Verify extensions and search indexes exist
        run: |
          python - <<'PY'
          from sqlalchemy import text
          from src.db.base import engine
          with engine.connect() as c:
              exts = {r[0] for r in c.execute(text("select extname from pg_extension"))}
              assert {"pgcrypto", "pg_trgm", "vector"} <= exts, f"missing extensions: {exts}"
              idx = {r[0] for r in c.execute(text(
                  "select indexname from pg_indexes where schemaname='public'"))}
              for required in ("ix_comp_desc_trgm", "ix_comp_fts",
                               "ix_chunks_fts", "ix_chunks_embedding"):
                  assert required in idx, f"missing index {required}"
          print("extensions and indexes OK")
          PY

      - name: Tests (PostgreSQL)
        # conftest forces a SQLite URL for isolation, so the suite is pointed at
        # Postgres explicitly here via SUPPORTNOVA_TEST_DATABASE_URL.
        env:
          SUPPORTNOVA_TEST_DATABASE_URL: postgresql+psycopg://supportnova:supportnova@localhost:5432/supportnova_test
        run: pytest -q
