non_functional_requirements:
  NFR-1:
    name: Performance
    target: Analyse, validate and generate an initial recommendation within 20 seconds.
    status: partial
    gap: >-
      Per-complaint latency is measured and reported as mean, p50, p95 and
      max by the benchmark runner, alongside per-pipeline timings on every
      stored run. p95 rather than a mean, because NFR 1 caps each
      complaint and a mean hides the tail that would breach it. The figure
      against the 20-second target is quoted once the 500-complaint
      dataset exists to measure it over.
    evidence: [genai_runs.latency_ms, validation_runs.latency_ms]
    approach: >-
      Latency is recorded per pipeline run and surfaced in the benchmark
      console and the X-Response-Time-ms header, so the claim is measured
      rather than asserted.

  NFR-2:
    name: Scalable
    target: 10000 complaints, 100 categories and subcategories, 1000 knowledge-base documents.
    status: partial
    evidence: [ix_comp_status_created, ix_comp_queue, ix_chunks_embedding, ix_comp_fts]
    approach: Indexed query paths, pagination on every list endpoint, batch job runner.
    gap: >-
      Batch processing is designed around a ThreadPoolExecutor with pre-loaded
      rules and taxonomy, and both pipelines accept hoisted configuration so a
      long run does not reload them per complaint. The 500-complaint benchmark
      that evidences the throughput target needs the dataset.

  NFR-3:
    name: Usable
    target: Intuitive interface for customers, agents, reviewers, managers and administrators.
    status: frontend

  NFR-4:
    name: Accuracy and Compliance
    target: >-
      All mandatory escalation conditions and critical routing rules enforced
      before final verification; policy-based recommendations carry valid
      source references.
    status: partial
    evidence: [validation_runs.escalation_floor_code, complaint_policy_refs.was_active,
               benchmark_runs.metrics, src/services/benchmark.py]
    approach: >-
      Mandatory escalation recall is a headline benchmark metric with a target
      of 100 percent; prohibited-action violations target zero.
    gap: >-
      The scoring machinery is complete and tested: per-field accuracy against
      the ground-truth labels, guard compliance reported with its numerator and
      denominator, and the structural guarantee that no pipeline package can
      read an expected_* column. A percentage with no denominator renders as
      null rather than as 0 or 100, so an unmeasured figure is never displayed
      as a passing one. The numbers themselves are quoted once the authored
      dataset exists to measure them over.

  NFR-5:
    name: Available
    target: 99 percent uptime during evaluation, excluding external GenAI API outages.
    status: partial
    evidence: [health_endpoint]
    approach: >-
      Health endpoint plus an external uptime pinger to keep the free-tier
      instance warm. The application stays fully functional with the GenAI API
      unavailable, because Pipeline 2 is deterministic.
    gap: >-
      The degraded path is implemented and tested end to end: with no provider
      reachable, Pipeline 2 still classifies, routes, escalates and produces a
      persisted verification decision labelled INCOMPLETE rather than a
      fabricated agreement. The uptime figure itself is measured over the
      evaluation window and cannot be claimed in advance.

# ══════════════════════════════════════════════════════════════════════════
# 1.8 COMPETITION INTEGRITY AND ANTI-SHORTCUT REQUIREMENTS
# ══════════════════════════════════════════════════════════════════════════
integrity_requirements:
  1:  { name: Unique Organisation Scenario,    status: done,    evidence: [config/taxonomy.yaml] }
  2:
    name: Unique Complaint Dataset
    status: done
    evidence: [complaints.dataset_tag, complaints.expected_category_code, benchmark_runs,
               ../dataset/raftarxpress/, scripts/verify_dataset.py]
    notes: >-
      The corpus is authored and verified: 500 complaints, 13 categories, 34
      subcategories, 9 departments, 25 policy documents, 105 resolution rules
      and 67 mandatory escalation rules -- every SRS minimum met or exceeded,
      with no structural or referential errors. The structural guarantee that
      no pipeline package can read an expected_* column still holds and is
      tested. `scripts/verify_dataset.py ../dataset/raftarxpress` reprints the
      counts on demand.
  3:
    name: Hidden Complaint Dataset
    status: done
    evidence: [complaints.dataset_tag, complaint_validation_issues]
    notes: >-
      An evaluator uploads a CSV or XLSX under a new tag and runs the
      benchmark against it, with no code change and no administrator
      token. The hidden path is the same code the authored dataset uses,
      on purpose: a separate importer for the hidden case would be the one
      that had never been run. Unlabelled complaints process normally and
      are reported as unscored rather than counted wrong.
  4:
    name: Hidden Policy Update
    status: done
    evidence: [document_versions.status, document_versions.superseded_by_id,
               document_versions.superseded_at, complaint_policy_refs.document_version_id,
               knowledge_base/versioning.py, src/services/policy_update.py,
               tests/test_policy_update.py]
    note: >-
      A policy dropped in mid-evaluation is picked up with no redeployment:
      activating the new version demotes the old one to SUPERSEDED, retrieval
      stops returning it from that moment, and the next analysis is grounded in
      the new text. Proved end to end in tests/test_policy_update.py -- the
      corpus answers with the old figure, an admin activates v2 through the
      API, and the corpus answers with the new one, in a single test with no
      restart between the two.

      The old version is demoted, never deleted. Contradiction detection needs
      the superseded text to compare against, and every decision taken while it
      governed would otherwise become unexplainable. A citation to it now
      resolves but scores OUTDATED, which is the distinction that matters: a
      reply grounded in last year's policy looks perfectly well-cited, and the
      applicability verdict is the only thing that tells them apart.

      Activation also answers the question an administrator asks the moment
      they press the button -- what did I just invalidate? Every complaint that
      cited the superseded version is listed, read from stored citations rather
      than recomputed, with open ones counted separately because a closed
      complaint decided under the old policy is history and an open one is a
      decision somebody is still about to act on. Nothing is re-analysed
      automatically: re-running hundreds of complaints would spend the
      free-tier quota in one click, and silently rewriting a decision an agent
      has already acted on is worse than leaving it visibly stale.
  5:  { name: Hidden Complaint Category,       status: done,    evidence: [categories],
        note: "Categories are database rows, not code. A new one needs no deploy." }
  6:  { name: Sentiment-Urgency Trap,          status: done, evidence: [lexicon_terms],
        note: "Emotional signals are recorded but forbidden from urgency rules; enforced by test." }
  7:  { name: Escalation Trap,                 status: done, evidence: [validation_runs.escalation_floor_code, rules.is_mandatory_escalation] }
  8:
    name: Prompt Injection Challenge
    status: done
    evidence: [injection_patterns, injection_events, complaints.injection_suspected,
               ../dataset/raftarxpress/complaints/]
    notes: >-
      All four defence layers are implemented and tested, and Pipeline 2 is
      structurally immune. The corpus carries 107 adversarial complaints
      against an SRS minimum of 20, so the defence is exercised rather than
      merely present; the intake API and the dataset import endpoint both
      exist, so an evaluator's own pack runs the same path.
  9:
    name: Unsupported Promise Challenge
    status: done
    evidence: [promise_patterns, response_flags, responses.guard_status, responses.version]
    notes: >-
      A promise is authorised only by an ELIGIBLE eligibility decision from
      Pipeline 2. A draft promising a refund on a complaint whose refund
      eligibility is REQUIRES_VERIFICATION is blocked, regenerated once with
      the offending phrase quoted back, and - if still non-compliant - routed
      to a human. The rejected draft is stored alongside the accepted one with
      its flagged spans, so the demonstration is a query against two rows
      rather than a claim.
  10:
    name: Contradictory Policy Challenge
    status: done
    evidence: [complaint_policy_refs.conflict_with_ref, complaint_policy_refs.precedence_tier,
               hallucination_checks/policy_conflict.py, knowledge_base/versioning.py,
               config/policy.yaml, tests/test_policy_conflict.py]
    note: >-
      Two policies that disagree are detected, the documented precedence order
      is applied, and the resolution is recorded rather than taken silently.
      That last part is the whole requirement: retrieval and precedence already
      made the system follow the higher policy, but a system that quietly
      follows the right one looks identical to a system that never noticed the
      wrong one existed, and the second is worth nothing to anybody auditing it.

      What counts as a disagreement is the claim checker's own definition,
      imported rather than restated: two sentences, one from each document,
      that share most of their vocabulary in BOTH directions -- so they are
      about the same thing -- and then either negate one another or state
      different figures in the same unit. A one-way containment test matches a
      short sentence against a long one that merely contains its words, and a
      detector that fires on agreeing policies floods the trace view until an
      agent stops reading it; the mutual test and the 0.60 floor in
      policy.yaml are what keep it quiet enough to be believed.

      Comparison is over each document's whole active version, not the two
      chunks that happened to be retrieved: a planted contradiction rarely
      sits in the two passages retrieval picked. The overruled reference is
      marked, never deleted -- conflict_with_ref names what beat it and the
      reason names the governing precedence tier -- because removing it would
      leave no evidence the conflict was ever found. Surfaced on
      GET /api/complaints/{ref}/explain as policy_conflicts.

  11:
    name: Missing Information Challenge
    status: done
    evidence: [complaints.missing_information, clarification_questions,
               complaint_processing/followup.py, tests/test_completion.py]
    gap: >-
      A complaint that omits what the rules need is accepted, not rejected, and
      the gap is recorded three ways: the missing fields on the complaint, a
      clarification question per outstanding item, and a CLARIFICATION
      follow-up so somebody is scheduled to chase it. Eligibility that cannot
      be settled without the missing fact resolves to REQUIRES_VERIFICATION
      rather than to a guess, and the response guard refuses to promise on it.
      An evaluator's own pack runs the same intake path through
      POST /api/benchmark/datasets/{tag}/import.
  12:
    name: Multi-Issue Complaint Challenge
    status: done
    evidence: [complaints.primary_issue, complaints.secondary_issue,
               complaints.support_department_id, routing_rules/departments.yaml]
    gap: >-
      A complaint carrying two issues keeps both: a primary and a secondary
      issue, an owning department and a supporting one, and every eligibility
      type the rules matched rather than only the first. Ownership stays
      singular on purpose -- two owners is the same as none, and the SLA clock
      has to belong to somebody. The corpus carries 51 ambiguous or multi-issue
      complaints against an SRS minimum of 25.
  13:
    name: Repeat Complaint Challenge
    status: done
    evidence: [complaints.repeat_count, complaints.previous_complaint_id,
               complaint_links, escalation_rules/mandatory.yaml,
               complaint_processing/dedupe.py]
    gap: >-
      The repeat count is derived from stored prior complaints for that
      customer, never from the complaint claiming to be a repeat -- a claim is
      exactly what an adversarial submission would forge. Only unresolved prior
      contacts count, duplicates are linked rather than merged, and the
      escalation matrix raises the floor on repeat_count thresholds. The corpus
      carries 39 repeated or near-duplicate complaints against an SRS minimum
      of 25.
  14:
    name: Live Modification Challenge
    status: done
    evidence: [rules, categories, departments, sla_policies, app_config,
               lexicon_terms, prompt_versions, audit_log,
               src/services/admin_config.py, src/api/v1/admin.py,
               tests/test_admin_config.py]
    note: >-
      Taxonomy, rules, lexicons, thresholds, comparison weights, SLA targets
      and prompt versions are all database rows read at evaluation time, and
      all of them are editable through /api/admin with no redeployment.
      POST /api/admin/rules/test is what makes the demonstration legible: it
      runs Pipeline 2 alone over a piece of text and returns what the rules
      conclude right now, deterministically, with no provider call and nothing
      written -- so an evaluator can edit a rule, post the same text again and
      see the difference in two requests, as often as they like, without
      spending the free-tier quota or filling the register with test rows.
      POST /api/admin/rules/reload is the undo, restoring the committed matrix
      so the next demonstration starts from a known state.

      Three guards keep the surface from becoming a back door. A rule that
      sets a mandatory escalation may have its level raised but never lowered,
      and cannot be deactivated at all: the floor is already enforced against
      the model, the comparison engine and a human reviewer, and an admin API
      able to switch off the rule that sets it would be a fourth way through
      and the quietest of the four, because it leaves no override on any
      complaint to notice. A change is refused at save time rather than at
      evaluation time, with every problem named at once -- a malformed
      condition, a signal no active lexicon term raises, an outcome naming a
      code that does not exist -- because a rule that saves cleanly and then
      silently never fires looks exactly like the system ignoring the
      evaluator. And every rule change re-stamps the ruleset version, so a
      validation_run recorded before the edit stays attributable to the rules
      that actually produced it.
  15:
    name: Deliberate Defect Challenge
    status: done
    evidence: [security/deliberate_defect.py, security/response_guard.py,
               comparison_engine/decision.py, tests/test_deliberate_defect.py]
    note: >-
      Four documented defects, each run through the production detector that
      should catch it, all four caught: a reply promising a refund no ELIGIBLE
      decision authorises (response guard, CRITICAL); an authorised
      compensation for ten times its ceiling -- the expensive one, because
      eligibility genuinely says yes, every other gate passes and only the
      number is wrong; a citation to a policy that does not exist; and a model
      downgrading a mandatory safety escalation to NONE, which the floor raises
      back to CRITICAL_MGMT.

      The defect is never installed. There is no flag that makes SupportNova
      behave badly and no configuration row that degrades it: each
      demonstration builds its faulty artefact inside one request, checks it
      and discards it. A switch that could break the running system in exchange
      for a better demo can be left on, and then the defect is not deliberate
      any more. One test asserts that isolation directly -- a demonstration
      persists nothing -- and a second asserts that no file in any of the six
      pipeline packages so much as mentions the module, so there is no path by
      which a demonstration could reach a real complaint.

      The detectors are the real ones: scan_response is the same function that
      guards every customer reply and build_reconciled the same one that
      enforces the floor on every complaint. A simplified checker written here
      would demonstrate only that the demonstration works. Served at
      GET /api/admin/defects and POST /api/admin/defects/demonstrate.
  16: { name: GitHub Activity,                 status: planned, evidence: [.github/workflows/ci.yml] }
  17: { name: No Hard-Coded Outputs,           status: done,    evidence: [genai_runs, validation_runs, rule_hits, comparisons],
        note: "Every displayed value traces to a stored run record or rule hit." }
  18: { name: GenAI API Restriction,           status: done, evidence: [python_validation/],
        note: "Pipeline 2 imports no provider client; its CLI runs with no API key set." }
  19: { name: AI Tool Usage Declaration,       status: done,    evidence: [../AI_USAGE.md] }
