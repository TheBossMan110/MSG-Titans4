# ========================================================================
# RaftarXpress - AUTHORED LEXICON
#
# Written by hand, from the taxonomy. This is the vocabulary a courier's
# customers actually use, which is a different thing from the vocabulary the
# rule matrix is written in: the author of RULE-001 wrote "transit delay
# exceeding 72 hours", and the customer writes "my parcel is late".
#
# Generated terms come from the rule prose and are kept -- they discriminate
# well between rules inside one subcategory. These carry the topic. Both are
# merged by scripts/convert_raftarxpress.py; where a signal appears in both,
# the terms are combined rather than replaced.
#
# WHERE THESE COME FROM MATTERS. Every term here is derived from the
# subcategory's own name and meaning, as a person configuring the system would
# write it. None of it is taken from the 500 complaints. Reading the corpus and
# harvesting its words would fit the rule engine to the set it is scored
# against: Pipeline 2's accuracy would measure how well the extractor
# memorised the test set, and the dual-pipeline comparison would become one
# pipeline checking its own homework.
#
# m: WORD   matches the whole word only     ("late" does not match "chocolate")
# m: PHRASE matches the sequence            ("not arrived")
# m: REGEX  matches the pattern             ("deliver(y|ed|ies)")
# ========================================================================

# -- cross-cutting -------------------------------------------------------
# These decide severity regardless of what the complaint is about. They were
# the gap: the generated lexicon produces one topic signal per subcategory and
# nothing that cuts across them, so nothing keyed on legal exposure, repeat
# contact or money at risk. A complaint can be a routine delay by topic and a
# critical matter by exposure.
cross_cutting:

  legal_threat:
    description: >-
      Legal or regulatory exposure. Routes to Compliance and raises the floor:
      once a customer has mentioned a lawyer, a reply that commits the company
      to anything is a liability, and the response guard is stricter about it.
    weight: 3.0
    terms:
      - { t: "legal action",            m: PHRASE }
      - { t: "legal notice",            m: PHRASE }
      - { t: "take you to court",       m: PHRASE }
      - { t: "see you in court",        m: PHRASE }
      - { t: "my lawyer",               m: PHRASE }
      - { t: "our lawyer",              m: PHRASE }
      - { t: "my solicitor",            m: PHRASE }
      - { t: "legal counsel",           m: PHRASE }
      - { t: "law firm",                m: PHRASE }
      - { t: "sue you",                 m: PHRASE }
      - { t: "suing",                   m: WORD }
      - { t: "litigation",              m: WORD }
      - { t: "court order",             m: PHRASE }
      - { t: "breach of contract",      m: PHRASE }
      - { t: "consumer court",          m: PHRASE }
      - { t: "consumer protection",     m: PHRASE }
      - { t: "regulatory complaint",    m: PHRASE }
      - { t: "ombudsman",               m: WORD }
      - { t: "defamation",              m: WORD }
      - { t: "compensation claim",      m: PHRASE }

  regulatory_body:
    description: >-
      A named regulator or enforcement agency. Distinct from a general legal
      threat: a customs seizure or an FBR notice is not the customer being
      angry, it is a third party with statutory power already involved.
    weight: 3.0
    terms:
      - { t: "customs",                 m: WORD }
      - { t: "fbr",                     m: WORD }
      - { t: "pta",                     m: WORD }
      - { t: "secp",                    m: WORD }
      - { t: "federal investigation",   m: PHRASE }
      - { t: "police report",           m: PHRASE }
      - { t: "police complaint",        m: PHRASE }
      - { t: "fir",                     m: WORD }
      - { t: "seized",                  m: WORD }
      - { t: "impounded",               m: WORD }
      - { t: "confiscated",             m: WORD }
      - { t: "held by authorities",     m: PHRASE }
      - { t: "regulatory hold",         m: PHRASE }

  repeat_contact:
    description: >-
      The customer says they have been here before. Corroborating evidence
      only: the repeat COUNT is derived from stored prior complaints, never
      from the complaint claiming to be a repeat, because a claim is exactly
      what an adversarial submission would forge.
    weight: 1.5
    terms:
      - { t: "third time",              m: PHRASE }
      - { t: "fourth time",             m: PHRASE }
      - { t: "fifth time",              m: PHRASE }
      - { t: "again and again",         m: PHRASE }
      - { t: "still waiting",           m: PHRASE }
      - { t: "no one has replied",      m: PHRASE }
      - { t: "no response",             m: PHRASE }
      - { t: "chased",                  m: WORD }
      - { t: "chasing",                 m: WORD }
      - { t: "followed up",             m: PHRASE }
      - { t: "previous complaint",      m: PHRASE }
      - { t: "earlier complaint",       m: PHRASE }
      - { t: "raised this before",      m: PHRASE }
      - { t: "as i said before",        m: PHRASE }
      - { t: "repeatedly",              m: WORD }

  vip_or_corporate:
    description: >-
      A corporate, merchant or premium account. Recorded because the SLA
      matrix differs, not because the person matters more.
    weight: 1.5
    terms:
      - { t: "corporate account",       m: PHRASE }
      - { t: "merchant account",        m: PHRASE }
      - { t: "business account",        m: PHRASE }
      - { t: "our company",             m: PHRASE }
      - { t: "our warehouse",           m: PHRASE }
      - { t: "bulk shipment",           m: PHRASE }
      - { t: "freight contract",        m: PHRASE }
      - { t: "service agreement",       m: PHRASE }
      - { t: "sla",                     m: WORD }
      - { t: "enterprise",              m: WORD }
      - { t: "premium account",         m: PHRASE }

  time_critical_contents:
    description: >-
      What is inside makes the delay dangerous rather than annoying. This is
      the difference between a late parcel and a late organ transport, and it
      is detectable from the words alone.
    weight: 3.0
    terms:
      - { t: "medicine",                m: WORD }
      - { t: "medication",              m: WORD }
      - { t: "medical supplies",        m: PHRASE }
      - { t: "life-saving",             m: PHRASE }
      - { t: "life saving",             m: PHRASE }
      - { t: "insulin",                 m: WORD }
      - { t: "vaccine",                 m: WORD }
      - { t: "blood sample",            m: PHRASE }
      - { t: "organ",                   m: WORD }
      - { t: "transplant",              m: WORD }
      - { t: "chemotherapy",            m: WORD }
      - { t: "dialysis",                m: WORD }
      - { t: "surgery",                 m: WORD }
      - { t: "perishable",              m: WORD }
      - { t: "temperature-sensitive",   m: PHRASE }
      - { t: "cold chain",              m: PHRASE }
      - { t: "frozen",                  m: WORD }
      - { t: "expiring",                m: WORD }
      - { t: "passport",                m: WORD }
      - { t: "visa",                    m: WORD }
      - { t: "legal documents",         m: PHRASE }
      - { t: "exam",                    m: WORD }

