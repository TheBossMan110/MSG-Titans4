# -- injection patterns --------------------------------------------------
# Carried across unchanged. These describe how a support system is
# attacked, which does not vary with the company behind it.
injection_patterns:
  - label: INSTRUCTION_OVERRIDE
    severity: CRITICAL
    patterns:
      - "ignore (all |any |your |the )?(previous|prior|above|earlier) (instruction|rule|prompt|direction)s?"
      - "disregard (all |any |your |the )?(previous|prior|above|rules|instructions|policy|policies)"
      - "forget (everything|all|your) (you|instructions|rules|training)"
      - "do not (validate|verify|check|apply) (the )?(rules|policy|policies|validation)"
      - "skip (the )?(validation|verification|policy|approval) (step|check|process)?"
  - label: ROLE_HIJACK
    severity: CRITICAL
    patterns:
      - "you are now (a|an|the)"
      - "act as (a|an|the) (admin|administrator|supervisor|manager|system)"
      - "pretend (you are|to be)"
      - "new (system )?(prompt|instruction|role)\\s*:"
      - "</?(system|assistant|instruction)>"
      - "(developer|debug|god|jailbreak|dan|unrestricted) mode"
      - "(ai|assistant|bot|model|chatbot) (with|that has|having) no (rules|restrictions|limits|policies|filters)"
      - "let'?s play a (game|role)"
  - label: FAKE_AUTHORITY
    severity: HIGH
    patterns:
      - "(admin|administrator|system|manager|supervisor)\\s*(override|approval|instruction)"
      - "this (complaint|case|request) (is |has been )?(pre-?)?approved"
      - "authoris?zed by (management|the manager|head office)"
      - "internal note\\s*:\\s*approve"
      - "as (per|instructed by) (the )?(ceo|director|head office)"
      - '(^|\n)\s*(system|admin|administrator|developer)\s*(message|note|notice|update)?\s*:'
      - "authori[sz]ation (code|token|key)"
      - "i am (the|your) (admin|administrator|developer|ceo|system|owner)"
      - "i am (an?|the) (raftarxpress|company|support) (admin|administrator|employee|manager|staff|developer)"
  - label: FORCED_OUTCOME
    severity: HIGH
    patterns:
      - "approve (my|the|this) (refund|claim|request|compensation) (immediately|now|without)"
      - "issue (a |the )?(full )?refund (immediately|now|regardless|without)"
      - "mark (this|it) as (resolved|closed|approved)"
      - "set (priority|urgency) to (low|p3)"
      - "do not escalate"
      - '(reply|respond|answer|say|write|type)[^.\n]{0,30}(refund|compensation|claim|replacement)[^.\n]{0,30}(approved|granted|processed)'
      - "(just |please )?say[^.\n]{0,40}(approved|i promise|granted)"
      - "for testing purposes"
      - "(tell|confirm)( me)? (that )?my (refund|compensation|claim|replacement) (is|has been) (approved|granted|processed)"
      - "(promise|guarantee) me (a |an |the )?(full )?(refund|replacement|compensation)"
      - "as a special exception"
  - label: PROMPT_LEAK
    severity: MEDIUM
    patterns:
      - "(reveal|print|show|repeat|output) (your|the) (system )?(prompt|instructions|rules)"
      - "what (are|were) your (instructions|rules|system prompt)"
  - label: DELIMITER_FORGERY
    severity: HIGH
    patterns:
      - "</?untrusted_(complaint|document)>"
      - "\\[/?(system|instruction|end of complaint)\\]"
      - "-{3,}\\s*end of (complaint|customer) (text|message)\\s*-{3,}"
  - label: HIDDEN_CONTENT
    severity: MEDIUM
    patterns:
      - "[\\u200b\\u200c\\u200d\\u2060\\ufeff]{3,}"   # zero-width runs
      - "[\\u202a-\\u202e]"                            # bidi override
      - "\\s{80,}"                                     # whitespace padding
  # -- added 2026-09-25 after measuring the dataset's 51 prompt-injection complaints:
  #    15/51 were caught before, 51/51 after, 0 of 449 ordinary complaints flagged.
  - label: INSTRUCTION_OVERRIDE
    severity: CRITICAL
    patterns:
      - '\b(ignore|disregard|bypass|forget|override)\s+(all\s+|any\s+|your\s+|the\s+|standard\s+|internal\s+|prior\s+|previous\s+)*(rules?|rule\s*matrix|constraints|guidelines|safety\s+guidelines|instructions|knowledge\s*base|validation(\s+checks)?|polic(y|ies)|classification|audits?|safety\s+matrix|carriage\s+terms|tax)\b'
      - '\breset\s+(the\s+|your\s+)?(conversation|memory|context)'
      - '\b(execute|process|run)\s+the\s+(json|payload|code|command)'
  - label: ROLE_HIJACK
    severity: CRITICAL
    patterns:
      - '\byou\s+are\s+(now\s+)?(an?\s+|the\s+)?(ai|assistant|agent|chatbot|bot|language\s+model|llm)\b'
      - '\bas\s+an?\s+(ai|language\s+model|assistant)\b'
      - '\b(let''?s\s+)?role-?play\b'
      - '\brespond\s+in\s+character\b'
      - '\bjailbreak\b'
      - '\bunrestricted\s+(privileges|access|mode)\b'
      - 'assistant\s*:\s*(understood|sure|ok(ay)?|classify|i\s+will|i''ll|approve|mark|set|refund)'
      - '\bprompt[\s_-]*injection\b'
  - label: FAKE_AUTHORITY
    severity: HIGH
    patterns:
      - '\[\s*(system|admin|instruction|override|inject\w*|execute|bypass\w*|set_var|system_config|ignore)\b[^\]]{0,200}\]'
      - '\[\s*important\s*:[^\]]{0,160}\b(ai|assistant|say\s+yes|instruction|override|ignore)\b'
      - '<\s*/?\s*(override|emergency_override\w*|system|admin|instruction)\w*\s*>'
      - '#{1,6}\s*human\s+(evaluator|reviewer)'
      - '\b(evaluator|reviewer)\s+(notice|instruction)\b'
      - '\b(manually\s+|already\s+)?pre-?approved\s+by\b'
      - '\b(internal|confidential)\s+(memo|memorandum)\b[^\n]{0,80}\b(ai|agent|supportnova)\b'
      - '\b(emergency\s+executive\s+powers|executive\s+order)\b'
      - '\bsystem\s+(prompt\s+)?(directive|notice|override|bypass)\s*:'
      - '\b(refund_eligible|compensation_permitted|bypass_\w+|auto_credit_limit|max_compensation|escalation_level|admin)\s*[:=]\s*[''\"]?\w'
      - '\"action\"\s*:\s*\"[A-Z_]*OVERRIDE'
      - '\b(system|ai|bot)\s+ko\s+(bolo|kaho|batao)\b'
      - '\bqawaneen\s+(khatam|ignore)\b'
  - label: CODE_INJECTION
    severity: HIGH
    patterns:
      - '''\s*;\s*(drop|delete|update|insert|truncate)\b'
      - '\b(drop\s+table|union\s+select|truncate\s+table)\b'
      - '<\s*script\b'
      - '\bsudo\s+\S'
      - '\bsystemctl\s+(stop|start|disable|restart)\b'
      - '\b(eval|exec|compile)\s*\('
      - '\bsystem\s*\(\s*[''\"]'
      - '\$\{\s*jndi\s*:'
      - '\{\{[^}]{0,80}(self|__|config|cycler|class|import)[^}]{0,80}\}\}'
      - '<!--[^>]{0,200}(#set|inject|priority|refund|override)'
      - '\bcurl\s+-X\s+(POST|PUT|DELETE|PATCH)\b'

# ── 3. Unsupported-promise patterns (SRS Step 34) ─────────────────────────
# Each match is cross-checked against the permitted_actions that Pipeline 2
# derived.  A match with no matching permitted action is flagged, redacted or
# regenerated - never sent.
# ── 3. Unsupported-promise patterns (SRS Step 34; SRS 1.8 #9) ────────────
# A promise of type T in a generated reply is UNSUPPORTED unless Pipeline 2
# independently derived an eligibility decision of type `requires_eligibility`
# with outcome ELIGIBLE.
#
# `requires_eligibility` therefore names a value of the EligibilityType enum,
# which the eligibility rules in complaint_rules/eligibility.yaml actually
# produce. An earlier draft named invented action codes (ISSUE_REFUND,
# OFFER_COMPENSATION) that nothing else in the system emitted, which would
# have made every promise check vacuous: no permitted action would ever have
# matched, so either everything or nothing would be flagged.
#
# TIMELINE has no eligibility type. A committed date is checked against the
# cited policy instead, because no eligibility rule can authorise it.

# -- promise patterns ----------------------------------------------------
# Also unchanged: a promise of a refund is the same commitment whoever
# makes it, and requires_eligibility still names a real EligibilityType.
promise_patterns:
  - promise_type: REFUND
    requires_eligibility: REFUND
    patterns:
      - "(full|complete|100%|entire) refund"
      - "will (definitely |certainly )?(be )?refund(ed)?"
      - "guarantee[ds]? (a |your |the )?refund"
      - "refund (will be|is) (processed|issued|credited)"
  - promise_type: COMPENSATION
    requires_eligibility: COMPENSATION
    patterns:
      - "compensat(e|ion) (will|of|you)"
      - "(voucher|coupon|credit) (of|worth|will be)"
      - "goodwill (gesture|payment|credit)"
      - "we will pay (for|you)"
  - promise_type: REPLACEMENT
    requires_eligibility: REPLACEMENT
    patterns:
      - "(free|complimentary|no-cost) replacement"
      - "replacement (will be|is being) (sent|dispatched|shipped)"
      - "we will replace (it|your|the)"
  - promise_type: TIMELINE
    requires_eligibility: null   # checked against the cited policy instead
    patterns:
      - "within \\d+\\s?(hour|day|week|business day)s?"
      - "by (tomorrow|today|tonight|monday|tuesday|wednesday|thursday|friday|saturday|sunday)"
      - "guarantee[ds]? (delivery|resolution|repair) (by|within|on)"
      - "no later than"
  - promise_type: EXCEPTION
    requires_eligibility: POLICY_EXCEPTION
    patterns:
      - "(as |we will make )?an exception"
      - "we (will )?waive (the|your|all)"
      - "outside (of )?(the )?(normal |usual )?policy"
      - "special (approval|case|arrangement) for you"

# ── 4. Deterministic entity patterns (SRS Step 16) ────────────────────────
# Python's own extraction pass, compared against the model's extraction.

# -- entity patterns -----------------------------------------------------
# RaftarXpress references: CN- tracking, FWD- freight, MER- merchant.
entity_patterns:
  ORDER_ID: "\\b(?:CN|FWD)-?\\d{6,12}\\b"
  TRANSACTION_ID: "\\bMER-\\d{3,5}-[A-Z]{2,8}\\b"
  INVOICE_ID: "\\bINV-?\\d{5,10}\\b"
  COMPLAINT_REF: "\\bCMP-?\\d{4,8}\\b"
  AMOUNT: "(?:pkr|rs\\.?|inr|usd|[$])\\s?\\d[\\d,]*(?:\\.\\d{1,2})?"
  DATE_ISO: "\\b\\d{4}-\\d{2}-\\d{2}\\b"
  EMAIL: "[\\w.+-]+@[\\w-]+\\.[\\w.]{2,}"
  PHONE: "\\+?\\d[\\d\\s-]{8,14}\\d"
