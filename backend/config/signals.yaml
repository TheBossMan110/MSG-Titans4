# ========================================================================
# SupportNova - signals, lexicon and patterns
#
# GENERATED for RaftarXpress Logistics (Pvt) Ltd by
# scripts/convert_raftarxpress.py. Edit the dataset and re-run.
#
# The lexicon is DERIVED, and only from authored configuration: the
# subcategory names and the rule condition prose. It is never derived from
# the complaint corpus. Fitting the rule engine to the complaints it is
# scored against would make Pipeline 2's accuracy a measure of how well the
# extractor memorised the test set.
#
# Generated terms are a starting point, not a finished lexicon. Tune them
# against the benchmark's per-field accuracy, or live through the admin API
# at /api/admin/lexicon, which needs no redeploy.
# ========================================================================

