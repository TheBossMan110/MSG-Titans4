# ========================================================================
# RaftarXpress - CLASSIFICATION RULES
#
# What a complaint is about, decided without the model. Precedence
# rises with severity, so inside one subcategory the worse rule wins:
# a delayed parcel carrying life-saving drugs is not a routine delay.
#
# GENERATED from dataset/raftarxpress by scripts/convert_raftarxpress.py.
# Edit the dataset and re-run. Tune live at /api/admin/rules, which
# refuses a condition naming a signal no lexicon term raises.
# ========================================================================

version: "1.0"
ruleset: classification

rules:

  - rule_ref: RULE-001
    name: Standard domestic transit delay under 24 hours without perishable contents
    rule_type: CLASSIFICATION
    precedence: 60
    rationale: "Routine operational delay; priority based on transit SLA standard, not customer agitation level"
    when:
      signal: delayed_delivery_terms
    then:
      category: DELIVERY
      subcategory: DELAYED_DELIVERY
      department: LOGISTICS_OPS
      urgency: MEDIUM
      priority: P2
      follow_up_required: true
      policy_refs:
        - { doc_ref: DOC-003, section_ref: "1" }

  - rule_ref: RULE-002
    name: "Transit delay exceeding 72 hours with repeated customer inquiries (>2 times)"
    rule_type: CLASSIFICATION
    precedence: 63
    rationale: Extended SLA breach triggers elevated operational review regardless of initial package value
    when:
      all_of:
        - signal: delayed_delivery_terms
        - signal: rule_002_evidence
    then:
      category: DELIVERY
      subcategory: DELAYED_DELIVERY
      department: LOGISTICS_OPS
      support_department: CUSTOMER_RELATIONS
      urgency: HIGH
      priority: P1
      follow_up_required: true
      policy_refs:
        - { doc_ref: DOC-016, section_ref: "1" }

  - rule_ref: RULE-003
