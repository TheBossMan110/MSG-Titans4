  - rule_ref: ELG-SAF-0002-REPL
    name: Replacement for Hazard that has already caused injury or damage
    rule_type: ELIGIBILITY
    precedence: 135
    rationale: A danger that has already hurt somebody is not the same complaint as one that has not. Ranked above SAF-0001 so the more serious reading wins when both match.
    when:
      all_of:
        - signal: safety_lexicon_hit
        - signal: injury_mention
    eligibility:
