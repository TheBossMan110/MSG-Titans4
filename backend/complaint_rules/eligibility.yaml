    rationale: RULE-105 states what this case entitles the customer to. Only an explicit ELIGIBLE authorises a promise.
    when:
      all_of:
        - signal: delayed_delivery_terms
        - signal: rule_105_evidence
    eligibility:
      type: COMPENSATION
      outcome: NOT_ELIGIBLE
      requires_human_approval: false
      policy_ref: { doc_ref: DOC-014, section_ref: "3" }
      conditions:
        - "Nationwide highway flooding closes national transit artery for >5 days"

  - rule_ref: ELG-SAF-0001-REPL
    name: Replacement for Physical hazard reported, however calmly
    rule_type: ELIGIBILITY
    precedence: 130
    rationale: "A hazard is a hazard at any volume. SRS 1.8 #6: a calmly worded safety report must reach P0, and a furious one about a late parcel must not. Tone is recorded and structurally cannot reach this rule."
    when:
      signal: safety_lexicon_hit
    eligibility:
      type: REPLACEMENT
      outcome: NOT_ELIGIBLE
      requires_human_approval: true

  - rule_ref: ELG-SAF-0001-REFU
