  - rule_ref: ELG-STANCE-refund_not_pro-REFU
    name: A refund is never approved at the desk
    rule_type: ELIGIBILITY
    precedence: 90
    rationale: "SRS 1.8 #9. The rule engine may derive REQUIRES_VERIFICATION; turning that into a yes is a person's act, after they have checked the conditions. Wrongly withholding a refund is recoverable by a human; wrongly promising one is not."
    when:
      signal: refund_not_processed_terms
    eligibility:
      type: REFUND
      outcome: REQUIRES_VERIFICATION
      requires_human_approval: true

