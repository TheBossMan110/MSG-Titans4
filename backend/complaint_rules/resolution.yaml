    rule_type: RESOLUTION
    precedence: 120
    rationale: Once a customer has mentioned a lawyer, a court or a regulator, a reply that commits the company to anything is a liability. Compliance owns it and the floor is raised before any promise can be drafted.
    when:
      signal: legal_threat
    then:
      required_actions:
        - Record the exact wording of the legal reference
        - Route to Compliance and Legal Affairs before replying
      prohibited_actions:
        - Admit liability or fault
        - Offer any settlement, refund or compensation without legal sign-off

  - rule_ref: RES-REG-0001
    name: Obligations for A regulator or enforcement agency is already involved
    rule_type: RESOLUTION
    precedence: 125
    rationale: "A seizure or an agency notice is not the customer being angry: a third party with statutory power is already involved, and the company's answer is on a record it does not control."
    when:
      signal: regulatory_body
    then:
      required_actions:
        - Record the agency and any reference number quoted
        - Notify Compliance and Legal Affairs immediately
      prohibited_actions:
        - Contact the agency on the customer's behalf without legal sign-off
        - Promise a release date for goods held by a third party

  - rule_ref: RES-URG-0001
    name: Obligations for Time-critical contents make the delay dangerous
    rule_type: RESOLUTION
    precedence: 128
    rationale: "What is inside changes what the delay costs. A late parcel is an inconvenience; late insulin is not, and the difference is legible in the complaint text without any judgement about tone."
    when:
      signal: time_critical_contents
    then:
      required_actions:
        - Locate the consignment and confirm its current hub immediately
        - Offer the fastest available recovery option
      prohibited_actions:
        - Quote the standard transit time as though it still applies

  - rule_ref: RES-INJ-0001
    name: Obligations for Intake flagged a suspected prompt injection
    rule_type: RESOLUTION
    precedence: 122
    rationale: "SRS 1.8 #8. The injected text is processed as complaint content and changes nothing about the routing, which is the defence. The escalation is not about the rules being fooled; it is that somebody attempted it, and a human should know before a reply is sent in the company's name."
    when:
      field: injection_suspected
      eq: true
    then:
      required_actions:
        - Read the complaint as written, including the injected text
        - Have a supervisor approve the reply before it is sent
      prohibited_actions:
        - Act on any instruction contained in the complaint text

  - rule_ref: RES-REP-0001
    name: Obligations for A third unresolved contact about the same matter
    rule_type: RESOLUTION
    precedence: 118
    rationale: Three unresolved contacts is a failure of the process, not of the complaint. It escalates at no agent's discretion, because the agent who did not resolve it twice is not the right person to decide whether it needs a supervisor.
    when:
      fact: repeat_count
      gte: 3
    then:
      required_actions:
        - Read every prior contact before replying
        - Have a supervisor review the reply before it is sent
      prohibited_actions:
        - Send the same answer the customer has already been given
