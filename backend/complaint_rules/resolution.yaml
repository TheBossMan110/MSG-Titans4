  - rule_ref: RES-SAF-0001
    name: Obligations for Physical hazard reported, however calmly
    rule_type: RESOLUTION
    precedence: 130
    rationale: "A hazard is a hazard at any volume. SRS 1.8 #6: a calmly worded safety report must reach P0, and a furious one about a late parcel must not. Tone is recorded and structurally cannot reach this rule."
    when:
      signal: safety_lexicon_hit
    then:
      required_actions:
        - Instruct the customer to stop handling the item immediately
        - Log a safety incident record
        - Notify Safety and Risk Management within one hour
      prohibited_actions:
        - Ask the customer to test the item again
        - Close the complaint before a safety assessment is recorded
        - Confirm a replacement before eligibility is verified

  - rule_ref: RES-SAF-0002
    name: Obligations for Hazard that has already caused injury or damage
    rule_type: RESOLUTION
    precedence: 135
    rationale: A danger that has already hurt somebody is not the same complaint as one that has not. Ranked above SAF-0001 so the more serious reading wins when both match.
    when:
      all_of:
        - signal: safety_lexicon_hit
        - signal: injury_mention
    then:
      required_actions:
        - Record the injury or damage reported, verbatim
        - Escalate to Safety and Risk Management immediately
        - Preserve the item and all packaging as evidence
      prohibited_actions:
        - Offer any settlement before a safety assessment is recorded
        - Ask the customer to return the item by ordinary courier
        - Confirm a replacement before eligibility is verified

