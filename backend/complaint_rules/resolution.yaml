# ========================================================================
# RaftarXpress - RESOLUTION RULES
#
# What each case requires and forbids, straight from the authored
# matrix. A required step is stored against the complaint as MISSING
# and stays that way until an agent confirms it: whether 'check hub
# GPS scan history' actually happened is not readable from any text
# the system holds, and a checklist that ticked itself would be
# decorative.
#
# GENERATED from dataset/raftarxpress by scripts/convert_raftarxpress.py.
# Edit the dataset and re-run. Tune live at /api/admin/rules, which
# refuses a condition naming a signal no lexicon term raises.
# ========================================================================

version: "1.0"
ruleset: resolution

rules:

  - rule_ref: RES-001
    name: Obligations for Standard domestic transit delay under 24 hours without perishable contents
    rule_type: RESOLUTION
    precedence: 60
    rationale: RULE-001 states what this case requires and forbids. A required step stays outstanding until a person confirms it.
    when:
      signal: delayed_delivery_terms
    then:
      required_actions:
        - Check hub GPS scan history
        - Notify destination delivery hub
        - Send SMS update to consignee
      prohibited_actions:
        - Guarantee delivery time before hub dispatch confirmation
        - Cancel consignment unilaterally
      policy_refs:
        - { doc_ref: DOC-003, section_ref: "1" }

