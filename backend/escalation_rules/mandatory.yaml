# ========================================================================
# RaftarXpress - MANDATORY ESCALATION RULES
#
# The floor. Separate from classification on purpose: if the floor
# lived on the classification rule, editing that rule to fix a
# department could move the floor as a side effect. This is the only
# file that may set is_mandatory_escalation.
#
# GENERATED from dataset/raftarxpress by scripts/convert_raftarxpress.py.
# Edit the dataset and re-run. Tune live at /api/admin/rules, which
# refuses a condition naming a signal no lexicon term raises.
# ========================================================================

version: "1.0"
ruleset: escalation

rules:

  - rule_ref: ESC-002
    name: "Transit delay exceeding 72 hours with repeated customer inquiries (>2 times)"
    rule_type: ESCALATION
    precedence: 103
    mandatory_escalation: true
    rationale: RULE-002 makes this escalation mandatory. The floor may be raised above SUPERVISOR, never lowered below it.
    when:
      all_of:
        - signal: delayed_delivery_terms
        - signal: rule_002_evidence
    then:
      escalation: SUPERVISOR
      department: LOGISTICS_OPS
      urgency: HIGH
      priority: P1
      policy_refs:
        - { doc_ref: DOC-016, section_ref: "1" }

