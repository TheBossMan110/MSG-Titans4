  - rule_ref: ESC-SAF-0001
    name: Physical hazard reported, however calmly
    rule_type: ESCALATION
    precedence: 140
    mandatory_escalation: true
    rationale: "A hazard is a hazard at any volume. SRS 1.8 #6: a calmly worded safety report must reach P0, and a furious one about a late parcel must not. Tone is recorded and structurally cannot reach this rule."
    when:
      signal: safety_lexicon_hit
    then:
      escalation: CRITICAL_MGMT
      department: SAFETY
      urgency: CRITICAL
      priority: P0

  - rule_ref: ESC-SAF-0002
    name: Hazard that has already caused injury or damage
    rule_type: ESCALATION
    precedence: 145
    mandatory_escalation: true
    rationale: A danger that has already hurt somebody is not the same complaint as one that has not. Ranked above SAF-0001 so the more serious reading wins when both match.
    when:
      all_of:
        - signal: safety_lexicon_hit
        - signal: injury_mention
    then:
      escalation: CRITICAL_MGMT
      department: SAFETY
      urgency: CRITICAL
      priority: P0

  - rule_ref: LEG-0001
    name: Legal or regulatory exposure raised by the customer
    rule_type: ESCALATION
    precedence: 120
    mandatory_escalation: true
    rationale: Once a customer has mentioned a lawyer, a court or a regulator, a reply that commits the company to anything is a liability. Compliance owns it and the floor is raised before any promise can be drafted.
    when:
      signal: legal_threat
    then:
      escalation: COMPLIANCE_REVIEW
      department: COMPLIANCE
      urgency: HIGH
      priority: P1

  - rule_ref: REG-0001
    name: A regulator or enforcement agency is already involved
    rule_type: ESCALATION
    precedence: 125
    mandatory_escalation: true
    rationale: "A seizure or an agency notice is not the customer being angry: a third party with statutory power is already involved, and the company's answer is on a record it does not control."
    when:
      signal: regulatory_body
    then:
      escalation: COMPLIANCE_REVIEW
      department: COMPLIANCE
      urgency: CRITICAL
      priority: P0

  - rule_ref: URG-0001
    name: Time-critical contents make the delay dangerous
    rule_type: ESCALATION
    precedence: 128
    mandatory_escalation: true
    rationale: "What is inside changes what the delay costs. A late parcel is an inconvenience; late insulin is not, and the difference is legible in the complaint text without any judgement about tone."
    when:
      signal: time_critical_contents
    then:
      escalation: SPECIALIST
      department: MGMT_ESCALATIONS
      urgency: CRITICAL
      priority: P0

  - rule_ref: INJ-0001
    name: Intake flagged a suspected prompt injection
    rule_type: ESCALATION
    precedence: 122
    mandatory_escalation: true
    rationale: "SRS 1.8 #8. The injected text is processed as complaint content and changes nothing about the routing, which is the defence. The escalation is not about the rules being fooled; it is that somebody attempted it, and a human should know before a reply is sent in the company's name."
    when:
      field: injection_suspected
      eq: true
    then:
      escalation: SUPERVISOR
      department: COMPLIANCE
      urgency: HIGH
      priority: P1

  - rule_ref: REP-0001
    name: A third unresolved contact about the same matter
    rule_type: ESCALATION
    precedence: 118
    mandatory_escalation: true
    rationale: Three unresolved contacts is a failure of the process, not of the complaint. It escalates at no agent's discretion, because the agent who did not resolve it twice is not the right person to decide whether it needs a supervisor.
    when:
      fact: repeat_count
      gte: 3
    then:
      escalation: SUPERVISOR
      department: CUSTOMER_RELATIONS
      urgency: HIGH
      priority: P1
